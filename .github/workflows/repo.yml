name: repo
on:
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch:
  push:
    paths:
      - "PKGBUILD"
      - "bitchord.desktop"
      - "tools/mkapt.py"
      - ".github/workflows/repo.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install deps + builder user
        run: |
          pacman -Sy --noconfirm jq git createrepo_c python
          id builder &>/dev/null || useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Resolve upstream native assets
        id: native
        run: |
          TAG=$(curl -s https://api.github.com/repos/kushagrasinghx/BitChord/releases/latest | jq -r .tag_name)
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "deb_name=BitChord-${VER}-linux-amd64.deb" >> "$GITHUB_OUTPUT"
          echo "rpm_name=BitChord-${VER}-linux-x86_64.rpm" >> "$GITHUB_OUTPUT"
          echo "deb_url=https://github.com/kushagrasinghx/BitChord/releases/download/${TAG}/BitChord-${VER}-linux-amd64.deb" >> "$GITHUB_OUTPUT"
          echo "rpm_url=https://github.com/kushagrasinghx/BitChord/releases/download/${TAG}/BitChord-${VER}-linux-x86_64.rpm" >> "$GITHUB_OUTPUT"
          echo "Upstream: $TAG"

      - name: Check upstream version
        id: ver
        run: |
          LATEST=$(curl -s https://api.github.com/repos/kushagrasinghx/BitChord/releases/latest | jq -r .tag_name | sed 's/^v//')
          CURRENT=$(grep -oP '^pkgver=\K.*' PKGBUILD | tr -d ' ')
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Upstream: $LATEST / PKGBUILD: $CURRENT"

      - name: Bump PKGBUILD if needed
        run: |
          LATEST="${{ steps.ver.outputs.latest }}"
          CURRENT="${{ steps.ver.outputs.current }}"
          if [ "$LATEST" != "$CURRENT" ]; then
            su builder -c "
              sed -i \"s/^pkgver=.*/pkgver=$LATEST/; s/^pkgrel=.*/pkgrel=1/\" PKGBUILD
              updpkgsums
              makepkg --printsrcinfo > .SRCINFO
            "
            echo "BUMPED=1" >> "$GITHUB_ENV"
          else
            echo "Already current, rebuilding repo DB from existing PKGBUILD."
          fi

      - name: Build package + repo DB (no debug pkg)
        run: |
          su builder -c '
            makepkg --noconfirm --nodeps
            mkdir -p out
            cp -f *.pkg.tar.zst out/
            cd out
            rm -f bitchord.db.tar.zst bitchord.files.tar.zst
            rm -f bitchord.db bitchord.files
            repo-add bitchord.db.tar.zst *.pkg.tar.zst
            rm -f bitchord.db bitchord.files
            cp -f bitchord.db.tar.zst bitchord.db
            cp -f bitchord.files.tar.zst bitchord.files
          '
          ls -lh out/

      - name: Commit bumped PKGBUILD
        if: env.BUMPED == '1'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bump to v${{ steps.ver.outputs.latest }}"
          file_pattern: "PKGBUILD .SRCINFO"

      # Packages are ~300MB — over GitHub's 100MB git/Pages file limit,
      # so binaries + pacman DB go to a floating `current` Release (2GB limit).
      # pacman Server below points at .../releases/download/current/
      # APT uses the same Release as a flat repo (Packages + .deb side by side).
      # YUM repodata is tiny text -> gh-pages; RPMs stay on the Release via
      # createrepo_c --location-prefix (absolute URLs in primary.xml).
      - name: Build APT flat repo + YUM repodata
        run: |
          su builder -c '
            set -e
            mkdir -p native apt yum pages-out/yum
            curl -fL -o "native/${{ steps.native.outputs.deb_name }}" "${{ steps.native.outputs.deb_url }}"
            curl -fL -o "native/${{ steps.native.outputs.rpm_name }}" "${{ steps.native.outputs.rpm_url }}"
            cp native/*.deb apt/
            python3 tools/mkapt.py native apt
            cp native/*.rpm yum/
            createrepo_c --location-prefix "https://github.com/${{ github.repository }}/releases/download/current" yum
            cp -r yum/repodata pages-out/yum/
          '
          ls -lh apt/ yum/repodata/
      - name: Publish repos to floating `current` release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: current
          name: "current repo"
          body: "Rolling repo for BitChord Linux.\n- Arch: Server = https://github.com/itsmeadarsh2008/bitchord-linux-pkgs/releases/download/current (pacman)\n- Debian/Ubuntu: deb822 Suites ./, URIs = same URL, Trusted yes (flat APT repo)\n- Fedora/RHEL/openSUSE: baseurl = https://itsmeadarsh2008.github.io/bitchord-linux-pkgs/yum (repodata on Pages, RPMs via absolute URLs)"
          files: |
            out/*.pkg.tar.zst
            out/bitchord.db.tar.zst
            out/bitchord.db
            out/bitchord.files.tar.zst
            out/bitchord.files
            native/*.deb
            native/*.rpm
            apt/Packages
            apt/Packages.gz
            apt/Release
          fail_on_unmatched_files: true

      - name: Deploy YUM repodata to Pages (tiny XML only)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-out
          keep_files: true
