name: repo
on:
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch:
  push:
    paths:
      - "PKGBUILD"
      - ".github/workflows/repo.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install deps + builder user
        run: |
          pacman -Sy --noconfirm jq git
          id builder &>/dev/null || useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Check upstream version
        id: ver
        run: |
          LATEST=$(curl -s https://api.github.com/repos/kushagrasinghx/BitChord/releases/latest | jq -r .tag_name | sed 's/^v//')
          CURRENT=$(grep -oP '^pkgver=\K.*' PKGBUILD | tr -d ' ')
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Upstream: $LATEST / PKGBUILD: $CURRENT"

      - name: Bump PKGBUILD if needed
        run: |
          LATEST="${{ steps.ver.outputs.latest }}"
          CURRENT="${{ steps.ver.outputs.current }}"
          if [ "$LATEST" != "$CURRENT" ]; then
            su builder -c "
              sed -i \"s/^pkgver=.*/pkgver=$LATEST/; s/^pkgrel=.*/pkgrel=1/\" PKGBUILD
              updpkgsums
              makepkg --printsrcinfo > .SRCINFO
            "
            echo "BUMPED=1" >> "$GITHUB_ENV"
          else
            echo "Already current, rebuilding repo DB from existing PKGBUILD."
          fi

      - name: Build package + repo DB (no debug pkg)
        run: |
          su builder -c '
            makepkg --noconfirm --nodeps
            mkdir -p out
            cp -f *.pkg.tar.zst out/
            cd out
            rm -f bitchord.db.tar.zst bitchord.files.tar.zst
            rm -f bitchord.db bitchord.files
            repo-add bitchord.db.tar.zst *.pkg.tar.zst
            rm -f bitchord.db bitchord.files
            cp -f bitchord.db.tar.zst bitchord.db
            cp -f bitchord.files.tar.zst bitchord.files
          '
          ls -lh out/

      - name: Commit bumped PKGBUILD
        if: env.BUMPED == '1'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bump to v${{ steps.ver.outputs.latest }}"
          file_pattern: "PKGBUILD .SRCINFO"

      # Packages are ~300MB — over GitHub's 100MB git/Pages file limit,
      # so host the repo DB + pkg as a floating `current` Release (2GB limit).
      # pacman Server below points at .../releases/download/current/
      - name: Publish repo to floating `current` release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: current
          name: "current repo"
          body: "Rolling pacman repo. Do not use manually — add Server = https://github.com/itsmeadarsh2008/bitchord-linux-pkgs/releases/download/current to pacman.conf"
          files: |
            out/*.pkg.tar.zst
            out/bitchord.db.tar.zst
            out/bitchord.db
            out/bitchord.files.tar.zst
            out/bitchord.files
          fail_on_unmatched_files: true
